onboarding = false

[worktrees]
directory = "~/Code/wiz/wiz-worktrees"

[keys]
switch_workspace = "alt+1..9"
cycle_pane_next = "alt+}"
cycle_pane_previous = "alt+{"
zoom = "alt+z"
previous_workspace = "shift+alt+up"
next_workspace = "shift+alt+down"

[ui.toast]
delivery = "system"

[theme]
name = "terminal"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"
