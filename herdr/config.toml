onboarding = false

[worktrees]
directory = "~/Code/wiz/wiz-worktrees"

[keys]
switch_workspace = "alt+1..9"
cycle_pane_next = "alt+}"
cycle_pane_previous = "alt+{"
zoom = "alt+z"
previous_workspace = "shift+alt+up"
next_workspace = "shift+alt+down"

# Jump to the agent that finished a turn or is blocked; repeat to cycle (herdr/attention)
[[keys.command]]
key = "alt+a"
type = "shell"
command = "~/.config/herdr/attention"

# Delete the focused worktree checkout in the background (dorshinar/herdr-worktree-rm)
[[keys.command]]
key = "shift+alt+d"
type = "plugin_action"
command = "dorshinar.worktree-rm.remove"
description = "delete worktree checkout (background)"

[ui.toast]
delivery = "system"

[theme]
name = "terminal"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"
